name: stuff_organiser_ai
description: >-
  Stuff Organiser AI - a near-zero-friction organiser for household items and
  real paper piles. Runs in demo mode without Firebase credentials.
publish_to: "none"
version: 0.8.18+38

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  http: ^1.2.2
  image_picker: ^1.1.2
  package_info_plus: ^8.1.2
  permission_handler: 12.0.3
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  speech_to_text: 7.4.0
  google_fonts: ^6.2.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  image_picker_platform_interface: ^2.10.0

flutter:
  uses-material-design: true

# v0.8.5+25: coach chat drafts from the recognition lane's object list
# (paste intake on the interim route) instead of the canned demo script;
# otter and cat whisker dots removed per the closed mascot ruling.
# v0.8.6+26: web camera live preview survives every capture - the shared
# browser camera session is reused between shots (a fresh getUserMedia
# right after a stop can serve a dead frame) and is fully released when
# the scan flow closes.
# v0.8.7+27: the recognized-object paste intake runs once per uploaded
# photo (per-image reads from the recognition lane) and its dialog tracks
# the iOS Safari keyboard (top-aligned + shrunk input while typing); the
# chat photo bubble shows every uploaded angle as a labelled strip.
# v0.8.8+28: mascots with traced geometry render from Leaf's locked path
# pack v1 through the shared traced renderer (single locked expression
# per character; mood variants fast-follow); legacy code-painted mascots
# moved unchanged to mascot_painters_legacy.dart.
# v0.8.9+29: coach confirmation replies - the chat shows a reply bar at
# the verify/flagged confirmation points and the answer lands inline;
# result-page buttons equalized (both FilledButton.icon); the recognized-
# object paste dialog hides its buttons while the keyboard is up so the
# input box keeps its height; the anime three (twin tails, glasses boy,
# bob cut) replace the ninja/idol/mage alternates with Leaf's traced art
# (saved selections migrate to the pack default automatically).
# v0.8.10+30: mascot polish wave - all 15 mascots render from Leaf's
# path pack v2 (revision 2): animal head bases are true circles at tile
# spec (cat, red panda, quokka and sea otter rebuilt as exact 760px
# centered circles; bunny rebuilt clean from the approved sample) and
# the anime fringe outlines are smoothed to soft rounded waves (the
# blindfolded spiky outline stays untouched as the locked design); the
# dashboard version badge is synced again (it had lagged at v0.8.8+28).
# v0.8.11+31: the Paste Recognized List button is gone from the coach
# chat action row - paste survives as a quiet inline link inside the
# waiting bubble (gated on the awaiting-recognition state), so a scan
# still can't dead-end while the interim manual route lasts. The
# result-stage UI members split into scan_flow_ui2b.dart to keep every
# scan library file push- and verify-sized.
# v0.8.12+32: the idle+happy mascot variant wave - all 15 traced
# mascots gained a happy mood from Leaf's override packs (animals,
# food, anime): the renderer swaps exactly the mouth shape(s) per
# mascot via mascot_happy_overrides.dart while idle (and every other
# mood) keeps the byte-verified v2 base geometry.
# v0.8.13+33: dashboard title spacing - the title block moves down
# (top padding + a taller app bar) so the "Stuff Organiser AI" title's
# top gap matches the Demo mode chip; badge text synced in the same
# commit. Title wording swap rides the next build once confirmed.
# v0.8.14+34: the "Show my tidy plan" button is gone from the coach chat
# per the steward directive - finishing the coach's reveal flows straight
# into the tidy plan page, so the tidying suggestion is always delivered
# in the chat first and a premature skip onto an empty plan is impossible.
# v0.8.15+35: bunny's happy mouth widened 1.4x (82 -> 114.80px, width-only;
# depth, nose tuck and y-coords untouched) per Leaf's validated pack v1.1
# - closes the shy-smile flag from the v0.8.12 wiring check. Everything
# else byte-identical.
# v0.8.16+36: the QA fix batch plus the "Your spaces" redesign (Herrick's
# directive + Meiosis's regression findings): the tidy plan auto-saves when
# the result page opens (closing the tab can no longer lose suggestions);
# every scanned venue auto-adds to "Your spaces" and its recognized
# confirmed/verify objects land as unpacked items on the venue's page
# (flagged reads stay out); first runs start with an empty home (the demo
# seed is gone); coach interjections and the notes echo render as coach
# bubbles; onboarding is double-tap guarded; whitespace-only renames are
# rejected in the state layer; corrupt plan stores are reported honestly on
# both the save side and the Plan tab; the venue page goes multi-select with
# a "Finish organizing" bottom button (three-dots delete gone) and tappable
# "Drop in [venue]" chips; the dashboard badge derives from package
# metadata (package_info_plus); docs corrected (photo count, mess scaling,
# Settings About, PWA manifest, page title).
# v0.8.17+37: coach vocabulary variety (Norris directive) + the scan-to-
# email forward action (Lane 2, Cellulose's receive lane verified end to
# end): the plan drafter, the bucket suggestions and the chat assembly now
# rotate wording through a per-scan seeded no-repeat vocabulary bundle
# (rotating openers, varied lead-ins, confirmation questions, discard
# phrasings, Dan/Sha/Ri phrasings) so two scans never read alike while one
# conversation stays coherent; the Danshari method is untouched. Coach
# confirmation points are flagged structurally via a parallel list instead
# of matched by fixed opening words. The forward action lands in the scan
# flow right after upload: the photos ride in upload order with a body
# line pinning the order, the venue and the typed notes, and the scan ID
# in the subject line; APK shares natively, web uses the browser share
# sheet where it supports files and a mailto fallback where it does not,
# and the flow ends on the "package sent" labeling so nothing spins.
# v0.8.18+38: R2-01 race fix (the plan save reads a snapshot handed in by
# the caller, so a flow reset racing the side effects can no longer turn
# the save into a silent no-op) plus the functional test gate: real
# widget tests for the badge-from-package-metadata, the Plan tab storage
# contract (stored parts, empty first run, honest corrupt banner), the
# duplicate-space guard and the full scan->plan integration (paste
# recognition -> save + venue auto-add + unpacked items, flagged reads
# out). image_picker_platform_interface rides as a dev dependency for the
# picker double used by the integration test.