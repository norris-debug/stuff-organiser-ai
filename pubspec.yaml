name: stuff_organiser_ai
description: >-
  Stuff Organiser AI - a near-zero-friction organiser for household items and
  real paper piles. Runs in demo mode without Firebase credentials.
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  http: ^1.2.2
  image_picker: ^1.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
